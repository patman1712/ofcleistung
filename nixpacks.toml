# Railway Nixpacks Build-Config (statt Dockerfile)
# Nixpacks ist Railways eigener Builder - deutlich zuverlässiger bei Projekten
# mit nativen Modulen wie better-sqlite3 und ohne Dockerfile-Volume Fallstricke.
#
# Phasen:
#   setup    : System-Pakete installieren (Build-Tools fuer better-sqlite3)
#   install  : npm dependencies (root + client)
#   build    : Prisma Client erzeugen, TypeScript kompilieren, Vite bauen
#   start    : DB-Schema pushen -> Seed -> Server starten

[phases.setup]
  nixPkgs   = ["nodejs_20", "python3", "gcc", "gnumake", "pkg-config"]
  aptPkgs   = ["python3", "make", "g++", "ca-certificates"]
  cmds      = [
    "node --version",
    "npm --version",
    "mkdir -p data"
  ]

[phases.install]
  dependsOn = ["setup"]
  cmds      = [
    "echo '[install] root deps...'",
    "npm install --no-audit --no-fund --build-from-source --loglevel=error || npm install --build-from-source",
    "echo '[install] client deps...'",
    "cd client && npm install --no-audit --no-fund --build-from-source --loglevel=error || npm install --build-from-source"
  ]

[phases.build]
  dependsOn = ["install"]
  cmds      = [
    "echo '[build 1/3] Prisma Client generate'",
    "npx prisma generate",
    "echo '[build 2/3] Server TypeScript (tsc)'",
    "npx tsc -p tsconfig.json",
    "echo '[build 3/3] Client Vite build'",
    "npm run build:client",
    "echo '[build] Verify artifacts'",
    "ls -la dist/server.js client/dist/index.html"
  ]

[start]
  cmd       = """
              echo '=== [BOOT] OFC Leistungsdiagnostik ===' && \
              mkdir -p data && \
              echo '[1/3] Prisma db push' && \
              npx prisma db push --skip-generate && \
              echo '[2/3] Seed (if empty)' && \
              ( npm run seed || true ) && \
              echo '[3/3] Start server' && \
              node dist/server.js
              """

# Wichtige Umgebungsvariablen (Standardwerte - werden von Railway Variablen ueberschrieben)
[variables]
  NODE_ENV   = "production"
  PORT       = "3000"
  HOST       = "0.0.0.0"
  HOSTNAME   = "0.0.0.0"
