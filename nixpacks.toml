# nixpacks.toml - OFC Leistungsdiagnostik
# Node 20.x ERZWINGEN - sonst nimmt Railway manchmal Node 24 (beta/instabil)

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake", "pkg-config"]
aptPkgs = ["libatomic1", "ca-certificates"]

[phases.install]
cmds = [
  "echo '=== [install 1/2] Root dependencies ==='",
  "npm install --config-allow-scripts=true --config-omit= --config-audit=false --config-fund=false",
  "echo '=== [install 2/2] Client dependencies ==='",
  "cd client && npm install --config-allow-scripts=true --config-omit= --config-audit=false --config-fund=false",
]

[phases.build]
cmds = [
  "echo '=== [build 1/3] Prisma Client generate ==='",
  "npx prisma generate",
  "echo '=== [build 2/3] Server TypeScript (tsc) ==='",
  "npx tsc -p tsconfig.json",
  "echo '=== [build 3/3] Client Vite build ==='",
  "cd client && npm run build",
  "echo '=== [build verify] Artifacts ==='",
  "ls -la /app/dist/server.js /app/client/dist/index.html || true",
]

[start]
cmd = '''
echo '=== [BOOT] OFC Leistungsdiagnostik ==='
mkdir -p data
echo '[1/3] Prisma db push (SQLite schema)'
npx prisma db push --skip-generate
echo '[2/3] Seed (if empty DB - fehlertolerant)'
(npm run seed || true)
echo '[3/3] Start server (port ${PORT:-3000})'
exec node dist/server.js
'''
